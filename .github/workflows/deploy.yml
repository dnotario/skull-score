name: Deploy to Production and Staging

on:
  push:
    branches: [ prod, staging ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    - run: npm install
    - run: npm run build
    - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    - run: npm install
    - run: npm run build
    
    - name: Set deployment target
      id: target
      run: |
        if [ "${{ github.ref }}" = "refs/heads/prod" ]; then
          echo "repo=skull-score-prod" >> $GITHUB_OUTPUT
          echo "env=production" >> $GITHUB_OUTPUT
        else
          echo "repo=skull-score-staging" >> $GITHUB_OUTPUT
          echo "env=staging" >> $GITHUB_OUTPUT
        fi
    
    - name: Deploy files
      env:
        DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        TARGET_REPO: ${{ steps.target.outputs.repo }}
        ENVIRONMENT: ${{ steps.target.outputs.env }}
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Use gh cli for authentication
        gh repo clone dnotario/$TARGET_REPO deploy-repo
        cd deploy-repo
        
        # Clear old files
        find . -maxdepth 1 -type f ! -name '.git*' ! -name 'README.md' -delete
        
        # Copy all files from build directory
        cp -r ../build/runFiles/* .
        
        # Add CNAME file for custom domain (production only)
        if [ "$ENVIRONMENT" = "production" ]; then
          echo "www.skullkingscorekeeper.com" > CNAME
        fi
        
        # Create README if it doesn't exist
        if [ ! -f README.md ]; then
          echo "# Skull King Score Keeper - $ENVIRONMENT" > README.md
          echo "" >> README.md
          echo "Deployment repository for $ENVIRONMENT environment." >> README.md
          echo "Source: https://github.com/dnotario/skull-score" >> README.md
        fi
        
        # Commit and push if there are changes
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "Deploy $ENVIRONMENT from ${{ github.sha }}"
          
          # Configure remote URL with token for pushing
          git remote set-url origin https://$DEPLOY_TOKEN@github.com/dnotario/$TARGET_REPO.git
          git push
          echo "Deployed to $ENVIRONMENT successfully"
        else
          echo "No changes to deploy"
        fi